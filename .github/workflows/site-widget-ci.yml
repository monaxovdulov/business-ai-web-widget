name: Site Widget CI

on:
  pull_request:
    branches:
      - main
      - "codex/**"
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: site-widget-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/site-widget

jobs:
  test:
    name: Check, build, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: packages/site-widget/package-lock.json

      - name: Verify Node.js and npm versions
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v24.14.0"
          test "$(npm --version | cut -d. -f1)" = "11"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check types
        run: npm run check

      - name: Run unit and component tests
        run: npm test

      - name: Build production bundles
        run: npm run build

      - name: Run browser tests
        run: npm run test:browser
        env:
          CI: "true"

      - name: Upload Playwright HTML report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: site-widget-playwright-report
          path: packages/site-widget/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
